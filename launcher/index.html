<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.open-meteo.com; object-src 'none'; base-uri 'none'">
    <title>Home — preview</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script src="device.js" defer></script>
    <script src="time-controls.js" defer></script>
    <script src="ui.js" defer></script>
    <script src="microphone.js" defer></script>
    <script src="sources.js" defer></script>
    <script src="weather.js" defer></script>
  </head>
  <body>
    <main class="home" aria-label="Home">
      <div class="atmosphere" aria-hidden="true"></div>
      <div class="weather" id="weather" aria-label="Weather" hidden>
        <div class="weather-now">
          <span id="weather-current"></span>
          <img class="weather-icon" id="weather-icon" alt="">
        </div>
        <div class="weather-details">
          <span class="weather-forecast" id="weather-forecast"></span>
          <a class="weather-credit" href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-label="Weather data by Open-Meteo">Open-Meteo</a>
        </div>
        <ol class="weather-periods" id="weather-periods" aria-label="Next 24 hours" hidden></ol>
      </div>
      <div class="clock">
        <span id="microphone-recording" role="img" aria-label="Microphone recording" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="2" width="6" height="13" rx="3" fill="currentColor"/>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v4m-3 0h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <time id="clock" aria-label="Current time"></time>
      </div>

      <section class="launcher" aria-labelledby="selection-title">
        <h1 id="selection-title">Apple TV</h1>
        <nav class="tiles" aria-label="Sources and controls">
          <button class="tile selected" data-id="apple-tv" tabindex="0" aria-label="Apple TV, HDMI 1">
            <svg class="tile-art apple-tv" viewBox="0 0 220 150" aria-hidden="true">
              <defs>
                <linearGradient id="box-top" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#55585f"></stop>
                  <stop offset="1" stop-color="#24262b"></stop>
                </linearGradient>
                <linearGradient id="remote-body" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#f1f1f1"></stop>
                  <stop offset="1" stop-color="#a7a8ab"></stop>
                </linearGradient>
              </defs>
              <ellipse class="device-shadow" cx="105" cy="121" rx="84" ry="9"></ellipse>
              <path d="M24 65Q24 56 36 52L85 37Q93 35 101 38L150 55Q158 58 158 66V83Q158 91 148 94L101 109Q93 112 85 109L34 92Q24 89 24 81Z" fill="#151619"></path>
              <path d="M25 61Q25 55 36 52L85 37Q93 35 101 38L150 55Q163 60 151 65L101 81Q93 84 85 81L34 64Q27 62 25 61Z" fill="url(#box-top)"></path>
              <path d="M27 67L85 86Q93 89 101 86L155 69" fill="none" stroke="#202226" stroke-width="1"></path>
              <circle cx="139" cy="88" r="1.2" fill="#e8e8e8"></circle>
              <g transform="translate(172 22) rotate(16)">
                <rect x="2" y="2" width="26" height="103" rx="7" fill="#85878d"></rect>
                <rect width="26" height="103" rx="7" fill="url(#remote-body)"></rect>
                <circle cx="20" cy="9" r="2" fill="#55575b"></circle>
                <circle cx="13" cy="26" r="10" fill="#393b40"></circle>
                <circle cx="13" cy="26" r="6.3" fill="#54565b"></circle>
                <path d="M13 17V19M4 26H6M20 26H22M13 33V35" stroke="#999ba0" stroke-width=".7"></path>
                <circle cx="7.5" cy="47" r="4.2" fill="#3b3d42"></circle>
                <path d="M8.5 45L6.5 47L8.5 49" fill="none" stroke="#d3d4d7" stroke-width="1"></path>
                <circle cx="19" cy="47" r="3.8" fill="#3b3d42"></circle>
                <rect x="16.7" y="45.5" width="4.5" height="3" rx=".4" fill="none" stroke="#b9bbc0" stroke-width=".7"></rect>
                <circle cx="7.5" cy="61" r="3.8" fill="#3b3d42"></circle>
                <path d="M6 59.5L8 61L6 62.5M10 59.5V62.5" fill="none" stroke="#b9bbc0" stroke-width=".7"></path>
                <circle cx="7.5" cy="75" r="3.8" fill="#3b3d42"></circle>
                <rect x="15.3" y="57.2" width="7.5" height="23" rx="3.7" fill="#3b3d42"></rect>
                <path d="M17 63H21M19 61V65M17 75H21" stroke="#b9bbc0" stroke-width=".8"></path>
              </g>
            </svg>
            <span class="tile-label">Apple TV</span>
          </button>

          <button class="tile" data-id="hdmi-2" tabindex="-1" aria-label="Blu-ray, HDMI 2">
            <svg class="tile-art disc-player" viewBox="0 0 220 150" aria-hidden="true">
              <defs>
                <linearGradient id="player-top" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#393a3c"></stop>
                  <stop offset="1" stop-color="#202123"></stop>
                </linearGradient>
                <linearGradient id="player-front" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#090a0c"></stop>
                  <stop offset=".53" stop-color="#202224"></stop>
                  <stop offset="1" stop-color="#08090a"></stop>
                </linearGradient>
              </defs>
              <ellipse class="device-shadow" cx="110" cy="104" rx="94" ry="5"></ellipse>
              <path d="M16 76L31 62H188L204 76V97Q204 100 200 100H20Q16 100 16 97Z" fill="#17181a"></path>
              <path d="M16 76L31 62H188L204 76Z" fill="url(#player-top)"></path>
              <path d="M18 77H202V94H18Z" fill="url(#player-front)"></path>
              <path d="M18 94H202V98H18Z" fill="#303133"></path>
              <path d="M18 77H202" stroke="#545659" stroke-width=".8"></path>
              <path d="M128 78H145L128 94H111Z" fill="#b2b5b7" opacity=".13"></path>
              <text x="22" y="83" fill="#c3c5c8" font-family="Arial, sans-serif" font-size="4.2" font-weight="700">Panasonic</text>
              <text x="102" y="89" fill="#a7b8b9" font-family="monospace" font-size="5.2" letter-spacing=".5">0:00.00</text>
              <text x="186" y="93" fill="#8a8d91" font-family="Arial, sans-serif" font-size="2.5">DP-UB820</text>
              <path d="M177 72H184M189 72H196" stroke="#626569" stroke-width=".8"></path>
              <path d="M29 100H42V103H29ZM177 100H190V103H177Z" fill="#111214"></path>
            </svg>
            <span class="tile-label">Blu-ray</span>
          </button>

          <button class="tile audio-only" data-id="hdmi-3" disabled tabindex="-1" aria-label="HDMI 3, Arc Ultra, audio only, unavailable">
            <svg class="tile-art soundbar" viewBox="0 0 220 150" aria-hidden="true">
              <defs>
                <pattern id="arc-grille" width="2" height="2" patternUnits="userSpaceOnUse">
                  <circle cx=".65" cy=".65" r=".3" fill="#9fa29f"></circle>
                  <circle cx="1.65" cy="1.65" r=".3" fill="#9fa29f"></circle>
                </pattern>
              </defs>
              <ellipse class="device-shadow" cx="110" cy="90" rx="96" ry="5"></ellipse>
              <rect x="12" y="66" width="196" height="20" rx="10" class="soundbar-body"></rect>
              <path d="M23 67H197Q203 67 205 72H15Q17 67 23 67Z" fill="#f4f4f2"></path>
              <path d="M22 84H198" stroke="#b6b7b5" stroke-width="1.3" stroke-linecap="round"></path>
              <rect x="17" y="71" width="186" height="12" rx="6" fill="url(#arc-grille)"></rect>
              <rect x="98" y="73" width="24" height="7" rx="1" fill="#e6e6e3"></rect>
              <text x="110" y="78.1" text-anchor="middle" fill="#696b6b" font-family="Arial, sans-serif" font-size="4.8" font-weight="700" letter-spacing=".65">SONOS</text>
              <path d="M171 67H185" stroke="#d0d0cd" stroke-width="1.4" stroke-linecap="round"></path>
            </svg>
            <span class="tile-label">Arc Ultra</span>
            <span class="tile-detail">Audio only</span>
          </button>

          <button class="tile" data-id="hdmi-4" tabindex="-1" aria-label="HDMI 4">
            <svg class="tile-art" viewBox="0 0 220 150" aria-hidden="true">
              <path class="port-outline" d="M56 55H164V79L151 94H69L56 79Z"></path>
              <path class="port-pins" d="M73 65V77M82 65V77M91 65V77M100 65V77M110 65V77M120 65V77M129 65V77M138 65V77M147 65V77"></path>
            </svg>
            <span class="tile-label">HDMI 4</span>
          </button>

          <button class="tile" data-id="settings" tabindex="-1" aria-label="Settings">
            <svg class="tile-art settings-art" viewBox="0 0 220 150" aria-hidden="true">
              <g class="gear" transform="translate(110 75)">
                <path d="M-9-39H9L12-29L19-25L30-28L39-12L31-5V5L39 12L30 28L19 25L12 29L9 39H-9L-12 29L-19 25L-30 28L-39 12L-31 5V-5L-39-12L-30-28L-19-25L-12-29Z"></path>
                <circle r="19"></circle>
              </g>
            </svg>
            <span class="tile-label">Settings</span>
          </button>

          <button class="tile" data-id="art-mode" tabindex="-1" aria-label="Art Mode">
            <svg class="tile-art art-frame" viewBox="0 0 220 150" aria-hidden="true">
              <rect class="picture-frame" x="44" y="24" width="132" height="103" rx="3"></rect>
              <rect class="picture-mat" x="49" y="29" width="122" height="93"></rect>
              <rect class="picture-sky" x="60" y="40" width="100" height="71"></rect>
              <circle class="picture-sun" cx="132" cy="59" r="11"></circle>
              <path class="picture-mountain-back" d="M60 94L89 64L133 111H60Z"></path>
              <path class="picture-mountain-front" d="M87 111L129 78L160 99V111Z"></path>
            </svg>
            <span class="tile-label">Art Mode</span>
          </button>
        </nav>
        <div class="time-controls" hidden role="group" aria-label="Art Mode schedule">
          <button type="button" class="time-control" data-time="start" tabindex="-1" role="spinbutton" aria-valuemin="0" aria-valuemax="1439" aria-label="Sleep time">
            <span>Sleep</span><span class="time-value"></span>
          </button>
          <button type="button" class="time-control" data-time="end" tabindex="-1" role="spinbutton" aria-valuemin="0" aria-valuemax="1439" aria-label="Wake time">
            <span>Wake</span><span class="time-value"></span>
          </button>
        </div>
      </section>
      <p class="action-error" id="action-error" role="alert" hidden></p>
    </main>
  </body>
</html>
