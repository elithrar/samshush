[project]
name = "samsung-firmware-tools"
version = "0.2.0"
description = "Samsung firmware inspection and exact-build TV controls"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
